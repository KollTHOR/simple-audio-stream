name: Release Stable

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.8.14)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Execute Permissions for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease -Pchannel=stable
        env:
          RELEASE_KEYSTORE_PATH: ${{ secrets.RELEASE_KEYSTORE_PATH }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Prepare Release Assets
        id: prepare_assets
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          APK_NAME="simple-audio-stream-${TAG}.apk"
          SHA_NAME="${APK_NAME}.sha256"
          
          cp "$APK_SRC" "$APK_NAME"
          sha256sum "$APK_NAME" | awk '{print $1}' > "$SHA_NAME"
          
          COMMIT_SHA=$(git rev-parse HEAD)
          COMMIT_SHORT=$(git rev-parse --short=7 HEAD)
          VERSION_NAME="${TAG#v}"
          
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
          echo "sha_name=$SHA_NAME" >> $GITHUB_OUTPUT
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "commit_short=$COMMIT_SHORT" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "checksum=$(cat $SHA_NAME)" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_assets.outputs.tag }}
          name: "Release ${{ steps.prepare_assets.outputs.tag }}"
          body: |
            ### Release ${{ steps.prepare_assets.outputs.tag }}
            
            - **Version:** `${{ steps.prepare_assets.outputs.version_name }}`
            - **Commit:** `${{ steps.prepare_assets.outputs.commit_sha }}`
            - **Channel:** `Stable`
            - **SHA-256 Checksum:** `${{ steps.prepare_assets.outputs.checksum }}`
            
            <!-- metadata: channel=stable commit=${{ steps.prepare_assets.outputs.commit_sha }} -->
          files: |
            ${{ steps.prepare_assets.outputs.apk_name }}
            ${{ steps.prepare_assets.outputs.sha_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
