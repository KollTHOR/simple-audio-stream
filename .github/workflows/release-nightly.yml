name: Release Nightly

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release-nightly:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Prepare private release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::Required Actions secret ${secret_name} is not configured."
              exit 1
            fi
          done
          keystore_path="$RUNNER_TEMP/release-signing.keystore"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          if [[ ! -s "$keystore_path" ]]; then
            echo "::error::Decoded release keystore is empty."
            exit 1
          fi
          echo "RELEASE_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Grant Execute Permissions for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Resolve Release Version Metadata
        id: version_meta
        run: python3 .github/scripts/resolve_version.py --channel nightly --run-number ${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Nightly Release APK
        run: |
          ./gradlew assembleRelease \
            -Pchannel=nightly \
            -PversionCode=${{ steps.version_meta.outputs.version_code }} \
            -PversionName=${{ steps.version_meta.outputs.version_name }}
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release-signing.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Prepare Nightly Assets
        id: prepare_assets
        run: |
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          APK_TARGET="${{ steps.version_meta.outputs.apk_name }}"
          SHA_TARGET="${{ steps.version_meta.outputs.sha_name }}"
          
          cp "$APK_SRC" "$APK_TARGET"
          sha256sum "$APK_TARGET" | awk '{print $1}' > "$SHA_TARGET"
          echo "checksum=$(cat $SHA_TARGET)" >> $GITHUB_OUTPUT

      - name: Publish Nightly GitHub Prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_meta.outputs.tag_name }}
          name: ${{ steps.version_meta.outputs.release_title }}
          body: |
            ### Automated Nightly Build: `${{ steps.version_meta.outputs.tag_name }}`
            
            This is an automated development prerelease built from the `main` branch.
            
            - **Version:** `${{ steps.version_meta.outputs.version_name }}`
            - **Build:** `${{ steps.version_meta.outputs.version_code }}`
            - **Commit:** `${{ steps.version_meta.outputs.commit_sha }}`
            - **Build Date:** `${{ steps.version_meta.outputs.build_date }}`
            - **Channel:** `Nightly`
            - **SHA-256 Checksum:** `${{ steps.prepare_assets.outputs.checksum }}`
            
            <!-- metadata: channel=nightly commit=${{ steps.version_meta.outputs.commit_sha }} versionCode=${{ steps.version_meta.outputs.version_code }} versionName=${{ steps.version_meta.outputs.version_name }} -->
          files: |
            ${{ steps.version_meta.outputs.apk_name }}
            ${{ steps.version_meta.outputs.sha_name }}
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
